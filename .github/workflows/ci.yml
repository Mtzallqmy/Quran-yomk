name: Quran Yutla CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-environment-and-contracts:
    name: Validate Environment Templates & Checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Environment Templates
        run: |
          chmod +x scripts/check-env.sh scripts/validate-checksums.sh
          ./scripts/check-env.sh
          ./scripts/validate-checksums.sh

  admin-nextjs:
    name: Admin Next.js (Build & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint and Typecheck
        run: |
          npm run lint --workspaces --if-present
          npm run typecheck --workspaces --if-present

  mobile-flutter:
    name: Flutter Mobile (Test & Analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Analyze & Test Mobile
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
