name: Tarteel Islamic Suite ARM64 Release

on:
  push:
    branches:
      - release/islamic-suite-72
    paths:
      - 'apps/mobile/**'
      - 'apps/admin_mobile/**'
      - 'supabase/**'
      - 'docs/ISLAMIC_SUITE_INTEGRATION.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/dual-app-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: islamic-suite-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Edge Function tests
        run: node --test supabase/functions/_shared/*.test.mjs

      - name: Resolve and format user application
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test

      - name: Resolve and format admin application
        working-directory: apps/admin_mobile
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test

      - name: Verify user application
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Verify admin application
        working-directory: apps/admin_mobile
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Verify Android 8+ client configuration
        run: |
          set -euo pipefail
          grep -q 'applicationId = "app.tarteel.tarteel"' apps/mobile/android/app/build.gradle.kts
          grep -q 'minSdk = 26' apps/mobile/android/app/build.gradle.kts
          grep -q '"package_name": "app.tarteel.tarteel"' apps/mobile/android/app/google-services.json
          grep -q '"project_id": "tarteel-b755d"' apps/mobile/android/app/google-services.json
          grep -q 'applicationId = "app.tarteel.admin"' apps/admin_mobile/android/app/build.gradle.kts
          grep -q 'minSdk = 26' apps/admin_mobile/android/app/build.gradle.kts
          test ! -e apps/admin_mobile/android/app/google-services.json

      - name: Build user ARM64 APK
        working-directory: apps/mobile
        run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=TARTEEL_API_BASE_URL=https://qkroecnecdxghcqvvoxn.supabase.co/functions/v1/tarteel-api

      - name: Build admin ARM64 APK
        working-directory: apps/admin_mobile
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect and inspect ARM64 APKs
        run: |
          set -euo pipefail
          mkdir -p release/arm64
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk release/arm64/tarteel-user-0.8.2-arm64.apk
          cp apps/admin_mobile/build/app/outputs/flutter-apk/app-release.apk release/arm64/tarteel-admin-0.3.1-arm64.apk

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          "$AAPT" dump badging release/arm64/tarteel-user-0.8.2-arm64.apk > release/arm64/user-badging.txt
          "$AAPT" dump badging release/arm64/tarteel-admin-0.3.1-arm64.apk > release/arm64/admin-badging.txt
          grep -q "package: name='app.tarteel.tarteel'" release/arm64/user-badging.txt
          grep -q "versionName='0.8.2'" release/arm64/user-badging.txt
          grep -q "sdkVersion:'26'" release/arm64/user-badging.txt
          grep -q "native-code: 'arm64-v8a'" release/arm64/user-badging.txt
          grep -q "package: name='app.tarteel.admin'" release/arm64/admin-badging.txt
          grep -q "versionName='0.3.1'" release/arm64/admin-badging.txt
          grep -q "sdkVersion:'26'" release/arm64/admin-badging.txt
          grep -q "native-code: 'arm64-v8a'" release/arm64/admin-badging.txt

          for apk in release/arm64/*.apk; do
            if strings "$apk" | grep -Ei '(BEGIN (RSA )?PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT_JSON|SUPABASE_SERVICE_ROLE_KEY|sb_secret_[A-Za-z0-9_-]{12,})'; then
              echo "Privileged credential material was found in $apk" >&2
              exit 1
            fi
          done

          sha256sum release/arm64/*.apk > release/arm64/SHA256SUMS.txt
          {
            echo '## Tarteel Islamic Suite ARM64'
            echo
            echo '- User: `app.tarteel.tarteel` (`0.8.2+82`)'
            echo '- Admin: `app.tarteel.admin` (`0.3.1+5`)'
            echo '- ABI: `arm64-v8a`'
            echo '- Minimum Android: 8.0 / API 26'
            echo '- Prayer engine: native AlarmManager with boot/time-change restore, offline licensed adhan selection, and optional scheduled iqamah playback'
            echo '- Islamic library: Supabase-backed trusted content with offline cache and SHA-256 validation'
            echo '- Signing: internal/debug signing; not Play Store production signing'
            echo '- Physical-device exact-alarm/FCM/battery test remains device-specific'
            echo
            echo '```text'
            cat release/arm64/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tarteel-islamic-suite-arm64-${{ github.run_number }}
          path: release/arm64
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.8.2-beta.82'
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOF'
          ## ترتيل — Islamic Suite ARM64 Beta 82

          هذا الإصدار يجمع مسار المحتوى الإسلامي الموثوق مع منبهات الصلاة الأصلية على Android. مواقيت الصلاة المحسوبة أو اليدوية تُجدول عبر AlarmManager وتُعاد بعد إعادة التشغيل وتغيير الوقت/المنطقة الزمنية. يمكن اختيار ملف أذان مرخص سبق تنزيله والتحقق من SHA-256 الخاص به ليعمل دون إنترنت، كما يمكن تفعيل ملف إقامة مرخص وتشغيله تلقائيًا بعد الصلاة بفاصل يحدده المستخدم.

          المكتبة الإسلامية تتصل بـ Supabase API موحد، وتدعم التخزين المحلي Offline-First للنصوص والصوتيات المرخصة. لا تظهر ملفات الصوت إلا بعد اعتماد إعادة التوزيع لكل ملف على حدة.

          - `tarteel-user-0.8.2-arm64.apk`: تطبيق المستخدم، Android 8+، ARM64.
          - `tarteel-admin-0.3.1-arm64.apk`: تطبيق الإدارة، Android 8+، ARM64.
          - `SHA256SUMS.txt`: بصمات التحقق.

          البناء يمر عبر اختبارات Edge وFlutter، تحليل Dart، بناء التطبيقين، فحص package/version/minSdk/ABI ومسح APK من مؤشرات مفاتيح privileged credentials قبل نشر الملفات. التوقيع الحالي داخلي للاختبار وليس توقيع Google Play النهائي، وبعض سلوك Exact Alarm/Doze يعتمد على الجهاز وسياسة الشركة المصنعة.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/arm64/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title 'ترتيل 0.8.2 — Trusted Islamic Library + Native Prayer Alarms ARM64 Beta 82' \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" release/arm64/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title 'ترتيل 0.8.2 — Trusted Islamic Library + Native Prayer Alarms ARM64 Beta 82' \
              --notes-file "$NOTES" \
              --prerelease
          fi
