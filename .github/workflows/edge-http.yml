name: Edge HTTP Boundaries
on:
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/edge-http.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/edge-http.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/functions/_shared/*.test.mjs
