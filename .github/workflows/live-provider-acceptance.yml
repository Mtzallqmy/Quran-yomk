name: Tarteel Live Provider Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
      - fix/separate-live-provider-ci
    paths:
      - 'apps/mobile/tool/islamic_content_acceptance.py'
      - 'apps/mobile/tool/quran_ci.py'
      - 'apps/mobile/tool/quran_audio_ci.py'
      - 'apps/mobile/assets/islamic_content_manifest.json'
      - 'apps/mobile/lib/src/api.dart'
      - '.github/workflows/live-provider-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: live-provider-acceptance-main
  cancel-in-progress: true

jobs:
  live-provider-acceptance:
    name: Verify deployed APIs and pinned provider bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Validate live Islamic Library Data bytes
        run: |
          python3 -m py_compile tool/islamic_content_acceptance.py
          python3 tool/islamic_content_acceptance.py assets/islamic_content_manifest.json --live

      - name: Validate deployed Mushaf API
        run: python3 tool/quran_ci.py

      - name: Validate live Quran audio providers
        run: python3 tool/quran_audio_ci.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarteel-live-provider-evidence
          path: |
            apps/mobile/release/quran
            apps/mobile/release/quran-audio
          if-no-files-found: warn
          retention-days: 14
