name: Managed Radio + Android

on:
  push:
    branches:
      - feature/quran-radio-real-integration
    paths:
      - 'apps/mobile/**'
      - 'supabase/functions/managed-radio/**'
      - 'supabase/migrations/**managed_radio**'
      - 'supabase/config.toml'
      - '.github/workflows/managed-radio-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'supabase/functions/managed-radio/**'
      - 'supabase/migrations/**managed_radio**'
      - 'supabase/config.toml'
      - '.github/workflows/managed-radio-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    name: Managed Radio Edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno format
        run: deno fmt --check supabase/functions/managed-radio/index.ts
      - name: Deno check
        run: deno check supabase/functions/managed-radio/index.ts
      - name: Repository secret guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            '(RADIO_CO_(CLIENT_SECRET|REFRESH_TOKEN|ACCESS_TOKEN|DJ_PASSWORD)[[:space:]]*=[[:space:]]*[^$[:space:]]+|\.dj\.radio\.co)' \
            apps supabase docs 2>/dev/null; then
            echo 'Potential Radio.co secret or DJ endpoint found in tracked application sources.' >&2
            exit 1
          fi

  android:
    name: Flutter Android Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=TARTEEL_API_BASE_URL=https://qkroecnecdxghcqvvoxn.supabase.co/functions/v1/tarteel-api
      - name: APK secret guard
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          if strings "$APK" | grep -Ei '(RADIO_CO_(CLIENT_SECRET|REFRESH_TOKEN|ACCESS_TOKEN|DJ_PASSWORD)|\.dj\.radio\.co)'; then
            echo 'Radio.co privileged material was found in the APK.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee build/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tarteel-managed-radio-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
