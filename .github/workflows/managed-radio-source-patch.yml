name: Managed Radio Source Patch
on:
  push:
    branches: [feature/quran-radio-real-integration]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'wire managed radio resolver')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quran-radio-real-integration
          fetch-depth: 0
      - name: Wire managed resolver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/tarteel-api/index.ts')
          s=p.read_text()
          old='rpc("tarteel_public_virtual_radio", {'
          new='rpc("tarteel_public_virtual_radio_managed", {'
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/tarteel-api/index.ts
          git commit -m 'feat(api): wire managed radio resolver'
          git push origin HEAD:feature/quran-radio-real-integration
