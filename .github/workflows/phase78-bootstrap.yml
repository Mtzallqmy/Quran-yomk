name: Phase 7+8 Acceptance

on:
  push:
    branches:
      - phase7-8-backend-admin-brand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase78-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm install --ignore-scripts
      - name: Backend contract tests
        working-directory: apps/admin
        run: npm test
      - name: TypeScript strict gate
        working-directory: apps/admin
        run: npm run typecheck
      - name: Next.js production build
        working-directory: apps/admin
        env:
          TARTEEL_ENVIRONMENT: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
          SUPABASE_SECRET_KEY: sb_secret_build_placeholder
          TARTEEL_PUBLIC_STREAM_BASE_URL: https://stream.invalid
          TARTEEL_INTERNAL_MOUNT: /tarteel.mp3
          TARTEEL_COOKIE_SECURE: 'true'
        run: npm run build
      - name: Client secret guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude='*.example' --exclude='*.md' --exclude-dir=node_modules --exclude-dir=.next 'sb_secret_[A-Za-z0-9_-]{20,}|service_role[^[:space:]]{20,}|ICECAST_(SOURCE|ADMIN)_PASSWORD=.+' apps/admin
          ! grep -RIE --exclude='*.md' --exclude-dir=node_modules --exclude-dir=.next 'SUPABASE_SECRET_KEY|ICECAST_SOURCE_PASSWORD|ICECAST_ADMIN_PASSWORD' apps/admin/app
      - name: Brand and admin contract guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROVISIONAL' docs/BRAND.md
          grep -q 'معتز العلقمي' docs/BRAND.md
          grep -q 'تعز، اليمن' docs/BRAND.md
          grep -q 'dir="rtl"' apps/admin/app/layout.tsx
          grep -q '/api/v1/admin/commands' apps/admin/app/admin-client.tsx
          grep -q '/api/v1/admin/media' apps/admin/app/admin-client.tsx
          grep -q 'upload-intent' apps/admin/app/admin-client.tsx

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio regression runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Radio Engine regression
        working-directory: services/radio-engine
        run: npm ci && npm test
      - name: Audio Worker regression
        working-directory: services/audio-worker
        run: npm ci && npm test
