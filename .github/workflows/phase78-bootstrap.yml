name: Phase 7 Payload Applier

on:
  push:
    branches:
      - phase7-8-backend-admin-brand
    paths:
      - '.phase78-bootstrap/**'
      - '.github/workflows/phase78-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .phase78-bootstrap/part00 ]]; then
            echo 'Payload already applied.'
            exit 0
          fi
          # part00 was transported with two trailing bytes; the staged payload
          # was intentionally split into 7000-byte chunks except the last.
          head -c 7000 .phase78-bootstrap/part00 > /tmp/part00.fixed
          cat /tmp/part00.fixed .phase78-bootstrap/part01 .phase78-bootstrap/part02 .phase78-bootstrap/part03 | tr -d '\r\n' > /tmp/phase7.b64
          test "$(wc -c </tmp/phase7.b64)" -eq 27388
          base64 --decode /tmp/phase7.b64 > /tmp/phase7.tar.gz
          tar -tzf /tmp/phase7.tar.gz >/dev/null
          tar -xzf /tmp/phase7.tar.gz
          rm -rf .phase78-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(api): implement Phase 7 backend API'
          git push origin HEAD:phase7-8-backend-admin-brand
