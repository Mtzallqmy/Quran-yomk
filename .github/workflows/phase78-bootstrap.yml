name: Phase 7 Payload Applier

on:
  push:
    branches:
      - phase7-8-backend-admin-brand
    paths:
      - '.phase78-bootstrap/**'
      - '.github/workflows/phase78-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .phase78-bootstrap/part00 ]]; then
            echo 'Payload already applied.'
            exit 0
          fi
          for f in .phase78-bootstrap/part00 .phase78-bootstrap/part01 .phase78-bootstrap/part02 .phase78-bootstrap/part03; do
            wc -c "$f"
            sha256sum "$f"
          done
          cat .phase78-bootstrap/part00 .phase78-bootstrap/part01 .phase78-bootstrap/part02 .phase78-bootstrap/part03 | tr -d '\r\n' > /tmp/phase7.b64
          echo "staged_base64_bytes=$(wc -c </tmp/phase7.b64)"
          base64 --decode /tmp/phase7.b64 > /tmp/phase7.tar.gz
          echo "decoded_archive_sha256=$(sha256sum /tmp/phase7.tar.gz | cut -d' ' -f1)"
          tar -tzf /tmp/phase7.tar.gz >/dev/null
          tar -xzf /tmp/phase7.tar.gz
          rm -rf .phase78-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(api): implement Phase 7 backend API'
          git push origin HEAD:phase7-8-backend-admin-brand
