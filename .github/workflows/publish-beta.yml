name: Publish Tarteel First Beta

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-beta:
    runs-on: ubuntu-24.04
    steps:
      - name: Download latest verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-release-apk.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          target=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.name | startswith("tarteel-android-release-"))] | sort_by(.created_at) | last | .id')
          test -n "$run_id"
          test -n "$target"
          test -n "$artifact_id"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          mkdir -p artifact
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > artifact.zip
          unzip -q artifact.zip -d artifact
          test -s artifact/tarteel-release-arm64-v8a.apk
          test -s artifact/tarteel-release-universal.apk
          test -s artifact/SHA256SUMS.txt
          expected_universal=$(grep 'tarteel-release-universal.apk' artifact/SHA256SUMS.txt | awk '{print $1}')
          expected_arm64=$(grep 'tarteel-release-arm64-v8a.apk' artifact/SHA256SUMS.txt | awk '{print $1}')
          actual_universal=$(sha256sum artifact/tarteel-release-universal.apk | awk '{print $1}')
          actual_arm64=$(sha256sum artifact/tarteel-release-arm64-v8a.apk | awk '{print $1}')
          test "$expected_universal" = "$actual_universal"
          test "$expected_arm64" = "$actual_arm64"

      - name: Publish verified beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name=$(jq -r '.versionName' artifact/release-metadata.json)
          version_code=$(jq -r '.versionCode' artifact/release-metadata.json)
          test -n "$version_name"
          test -n "$version_code"
          TAG="v${version_name}-beta.${version_code}"
          TITLE="ترتيل v${version_name} Beta ${version_code}"
          cat > notes.md <<'EOF'
          ## ترتيل — إصدار تجريبي موثّق

          نسخة APK تجريبية مبنية من آخر تشغيل Android ناجح ومتحقق منه.

          **التوافق:** Android 8.0 (API 26) أو أحدث.

          ### ملفات التحميل
          - `tarteel-release-arm64-v8a.apk` — موصى به لمعظم أجهزة Android الحديثة 64-bit.
          - `tarteel-release-universal.apk` — نسخة Universal للتوافق الأوسع.
          - `SHA256SUMS.txt` — بصمات التحقق من الملفات.

          ### أبرز الميزات
          - إذاعات القرآن والإذاعات الإسلامية وإذاعة ترتيل الافتراضية.
          - تشغيل الصوت في الخلفية وMedia Controls.
          - مصحف كامل 604 صفحة، عادي وتجويد ملون.
          - اختيار القارئ وتشغيل السور والآيات.
          - تنزيل التلاوات وصفحات المصحف للاستخدام دون إنترنت.
          - العلامات المرجعية واستعادة آخر موضع قراءة.
          - المقاطع المحفوظة ومؤقت النوم.
          - العربية والإنجليزية.

          هذه نسخة تجريبية وليست إصدار Google Play.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifact/tarteel-release-arm64-v8a.apk \
              artifact/tarteel-release-universal.apk \
              artifact/SHA256SUMS.txt \
              artifact/release-metadata.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              artifact/tarteel-release-arm64-v8a.apk \
              artifact/tarteel-release-universal.apk \
              artifact/SHA256SUMS.txt \
              artifact/release-metadata.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file notes.md \
              --prerelease
          fi
