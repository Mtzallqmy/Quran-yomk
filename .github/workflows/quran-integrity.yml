name: Quran Canonical Integrity

on:
  push:
    branches:
      - main
      - hardening/phase3-quran-integrity
    paths:
      - "scripts/quran-integrity/**"
      - "data/quran/canonical/**"
      - "supabase/functions/tarteel-api/quran.ts"
      - "supabase/functions/tarteel-api/quran_integrity_runtime.js"
      - ".github/workflows/quran-integrity.yml"
      - "supabase/seed/03_surahs.sql"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - "scripts/quran-integrity/**"
      - "data/quran/canonical/**"
      - "supabase/functions/tarteel-api/quran.ts"
      - "supabase/functions/tarteel-api/quran_integrity_runtime.js"
      - ".github/workflows/quran-integrity.yml"
      - "supabase/seed/03_surahs.sql"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: quran-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require committed canonical dataset
        run: |
          test -f data/quran/canonical/v2/dataset.json
          test -f data/quran/canonical/v2/manifest.json
      - name: Validate approved dataset and runtime fail-closed tests
        env:
          QURAN_INTEGRITY_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          node scripts/quran-integrity/validate.mjs --version 2 --base-ref "$QURAN_INTEGRITY_BASE_REF"
          node --test scripts/quran-integrity/*.test.mjs
