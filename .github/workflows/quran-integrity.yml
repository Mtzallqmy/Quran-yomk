name: Quran Canonical Integrity

on:
  push:
    branches:
      - hardening/phase3-quran-integrity
    paths:
      - "scripts/quran-integrity/**"
      - "data/quran/canonical/**"
      - ".github/workflows/quran-integrity.yml"
      - "supabase/seed/03_surahs.sql"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - "scripts/quran-integrity/**"
      - "data/quran/canonical/**"
      - ".github/workflows/quran-integrity.yml"
      - "supabase/seed/03_surahs.sql"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: quran-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-v1:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[quran-capture-request-v1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify Node runtime
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Capture canonical Quran v1 from current production editions
        run: node scripts/quran-integrity/capture.mjs --version 1
      - name: Validate captured dataset before commit
        run: |
          node scripts/quran-integrity/validate.mjs --version 1
          node --test scripts/quran-integrity/validate.test.mjs
      - name: Commit immutable capture result to hardening branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran/canonical/v1/dataset.json data/quran/canonical/v1/manifest.json
          if git diff --cached --quiet; then
            echo "No Quran dataset changes to commit."
            exit 0
          fi
          git commit -m "data(quran): capture canonical v1 [quran-capture-result]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[quran-capture-request-v1]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require committed canonical dataset
        run: |
          test -f data/quran/canonical/v1/dataset.json
          test -f data/quran/canonical/v1/manifest.json
      - name: Validate approved dataset and negative tests
        env:
          QURAN_INTEGRITY_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          node scripts/quran-integrity/validate.mjs --version 1 --base-ref "$QURAN_INTEGRITY_BASE_REF"
          node --test scripts/quran-integrity/validate.test.mjs
