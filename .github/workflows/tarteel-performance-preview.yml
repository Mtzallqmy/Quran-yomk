name: Tarteel ARM64 performance preview
on:
  push:
    branches: [test/tarteel-2097-performance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/test/tarteel-2097-performance'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_tarteelPerformancePreview: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Build optimized preview
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub \
            --dart-define=GIT_SHA="$GITHUB_SHA" \
            --dart-define=TARTEEL_CONTENT_BASE_URL=https://br-curly-salad-bajy1evn-tarteelcontent.compute.c-8.eu-central-1.aws.neon.tech \
            --dart-define=TARTEEL_CLOUD_BASE_URL=https://br-wispy-paper-bahpwe0x-tarteelcloud.compute.c-8.eu-central-1.aws.neon.tech \
            --dart-define=TARTEEL_API_BASE_URL=https://qkroecnecdxghcqvvoxn.supabase.co/functions/v1/tarteel-api
      - name: Verify preview identity and signature
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p preview
          apk=preview/Tarteel-2097-Performance-ARM64.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          "$sdk_tools/aapt2" dump badging "$apk" | tee preview/badging.txt
          grep -E "^package: name='app.tarteel.tarteel.performance' versionCode='2097'" preview/badging.txt
          grep -E "^(minSdkVersion|sdkVersion):'26'" preview/badging.txt
          grep -Fx "native-code: 'arm64-v8a'" preview/badging.txt
          if grep -q '^application-debuggable' preview/badging.txt; then
            echo "Expected an optimized, non-debuggable APK." >&2
            exit 1
          fi
          "$sdk_tools/apksigner" verify --verbose --print-certs "$apk" | tee preview/signature.txt
          "$sdk_tools/zipalign" -c -P 16 4 "$apk"
          (cd preview && sha256sum Tarteel-2097-Performance-ARM64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Tarteel-2097-Performance-ARM64
          path: preview
          if-no-files-found: error
  smoke:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tarteel-2097-Performance-ARM64
          path: preview
      - name: Download signed 2096 baseline
        run: |
          curl --fail --location --retry 2 --output baseline2096.apk 'https://github.com/Mtzallqmy/Quran-yomk/releases/download/v0.9.3-beta.1-preview.2096/Tarteel-0.9.3-beta.1-2096-ARM64-PREVIEW.apk'
          echo 'fb8f751aa008d10ffa50b746967724153dac04bad13c9b9f9ec3d729b6abe93e  baseline2096.apk' | sha256sum --check
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify co-install and app startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install baseline2096.apk
            adb install preview/Tarteel-2097-Performance-ARM64.apk
            adb shell pm list packages app.tarteel.tarteel | grep -Fx package:app.tarteel.tarteel
            adb shell pm list packages app.tarteel.tarteel.performance | grep -Fx package:app.tarteel.tarteel.performance
            adb shell am start -W -n app.tarteel.tarteel.performance/app.tarteel.tarteel.MainActivity > launch.txt
            cat launch.txt
            grep -q 'Status: ok' launch.txt
            adb shell uiautomator dump /sdcard/tarteel-performance.xml
            adb shell cat /sdcard/tarteel-performance.xml | grep -Fq 'package="app.tarteel.tarteel.performance"'
            adb shell pidof app.tarteel.tarteel.performance
