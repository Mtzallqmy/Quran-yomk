name: Publish verified Tarteel preview
on:
  push:
    branches: [feat/tarteel-mushaf-surah-unification-2092]
    paths: ['release-candidates/preview-2094.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: tarteel-publish-preview-2094
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Verify candidate and reconstruct signed APK without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/tarteel/publish_verified_preview.py
          --metadata release-candidates/preview-2094.json
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --output preview-release --prepare-only
      - name: Download exact signed2092 baseline
        run: |
          curl --fail --location --retry 2 --output preview-release/baseline2092.apk 'https://github.com/Mtzallqmy/Quran-yomk/releases/download/v0.9.1-beta.1-preview.2092/Tarteel-0.9.1-beta.1-2092-ARM64-PREVIEW.apk'
          echo '46c0ddd6cf99122192473ef8b409a70b1862ef764f6ef2b4ae885420ded2e10b  preview-release/baseline2092.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual ARM64 signed2092 upgrade and data retention
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/tarteel/upgrade_preview_acceptance.py --baseline preview-release/baseline2092.apk --candidate preview-release/Tarteel-0.9.2-beta.2-2094-ARM64-PREVIEW.apk --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --output preview-release/upgrade
      - name: Publish only after exact APK upgrade acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/tarteel/publish_verified_preview.py
          --metadata release-candidates/preview-2094.json
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --output preview-release --upgrade-evidence preview-release/upgrade/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarteel-signed-preview-release-evidence
          path: |
            preview-release/Tarteel-*.apk
            preview-release/verification/
            preview-release/upgrade/
            preview-release/release.json
