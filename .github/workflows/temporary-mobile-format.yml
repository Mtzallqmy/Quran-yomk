name: Temporary mobile formatter
on:
  push:
    branches:
      - feat/mobile-premium-ui
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-premium-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format changed mobile sources
        run: dart format apps/mobile/lib/src/theme.dart apps/mobile/lib/src/app.dart apps/mobile/lib/src/common.dart apps/mobile/lib/src/screens/home.dart apps/mobile/lib/src/screens/player.dart apps/mobile/test/widget_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps/mobile/lib/src/theme.dart apps/mobile/lib/src/app.dart apps/mobile/lib/src/common.dart apps/mobile/lib/src/screens/home.dart apps/mobile/lib/src/screens/player.dart apps/mobile/test/widget_test.dart
          git commit -m 'style: format mobile UI sources'
          git push origin HEAD:feat/mobile-premium-ui
