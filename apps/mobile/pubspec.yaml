name: quran_yutla_mobile
description: "Quran Yutla (قرآن يتلى) — Holy Quran Recitations, Curated 24/7 Radios, and Mushaf Reader"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  supabase_flutter: ^2.3.4
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
