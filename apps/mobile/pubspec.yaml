name: tarteel
description: Tarteel listener MVP for Quran live radio and on-demand recitations.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
