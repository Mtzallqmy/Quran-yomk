name: tarteel
description: Tarteel listener for Quran live radio, Mushaf reading, and recitations.
publish_to: none
version: 0.4.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  flutter_svg: ^2.2.4
  archive: ^4.2.0
  share_plus: ^12.0.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  intl: ^0.20.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/islamic_content_manifest.json
