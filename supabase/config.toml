project_id = "tarteel"

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[db.migrations]
enabled = true
schema_paths = ["./migrations/*.sql"]

[functions.tarteel-api]
verify_jwt = false

[functions.managed-radio]
verify_jwt = true

# Dedicated random cron token is verified server-side against Vault.
[functions.provider-sync]
verify_jwt = false

[functions.tarteel-api-health]
verify_jwt = false

# This function validates user JWTs, installation secrets and the cron bearer
# token itself because device registration also supports signed guest installs.
[functions.notifications]
verify_jwt = false
